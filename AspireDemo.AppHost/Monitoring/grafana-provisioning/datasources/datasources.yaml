apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:9411
    jsonData:
      maxLines: 1000
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    version: "2"
    jsonData:
      derivedFields:
        - datasourceUid: Tempo
          matcherRegex: "^(.*)$"
    editable: true
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: "10s"
