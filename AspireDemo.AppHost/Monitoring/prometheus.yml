global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aspire-collector"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "aspire-apps"
    scrape_interval: 15s
    static_configs:
      - targets: ["apiservice:9184", "webfrontend:9184"]
